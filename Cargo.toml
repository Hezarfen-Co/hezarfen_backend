[package]
name = "hezarfen_backend"
version = "0.1.0"
edition = "2024"

# Time-policy guard: clippy.toml lists the banned clock calls (local time,
# raw now() sources); deny makes `cargo clippy` fail on any reintroduction.
[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"

[dependencies]
tokio = { version = "1", features = ["full"] }
# IntervalStream for the live exam-monitor SSE tick.
tokio-stream = "0.1"
# "ws" backs the live exam room (WebSocket at /exams/{id}/attempt/ws);
# "multipart" backs note file uploads (POST /notes/{id}/files).
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv", "kv-mem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
argon2 = "0.5"
getrandom = "0.3"
hex = "0.4"
ulid = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
time = "0.3"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[dev-dependencies]
# test-util enables tokio::time::pause/advance for the rate limiter tests.
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
tempfile = "3"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.32"
