services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: hezarfen-postgres
    # 500 connections: the test suite mints a control+school pool per test
    # (nextest runs ~a dozen concurrently), which exhausts the 100 default.
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: hezarfen
      POSTGRES_PASSWORD: hezarfen
      POSTGRES_DB: hezarfen_control
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hezarfen -d hezarfen_control"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/hezarfen-backend:latest
    container_name: hezarfen-backend
    ports:
      - "8080:8080"
      # AI bridge (QUIC = UDP). Paired with AI_QUIC_ADDR below.
      - "8090:8090/udp"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      # The control database: the school registry + the builder accounts. Each
      # school lives in a Postgres database of its own, named from its slug.
      DATABASE_URL: postgres://hezarfen:hezarfen@postgres:5432/hezarfen_control
      FILES_PATH: /data/files
      RUST_LOG: info,hezarfen_backend=debug
      # First-boot builder seed: the operator who creates and suspends schools,
      # created once if the username doesn't exist yet. Local-dev credentials —
      # change or remove before exposing this anywhere.
      BUILDER_USERNAME: builder
      BUILDER_PASSWORD: builder123
      # Production knobs — uncomment as needed (see .env.example for docs):
      # COOKIE_SECURE: "true"
      # CORS_ALLOWED_ORIGINS: https://app.example.com
      # RATE_LIMIT_AUTH_PER_MINUTE: "10"
      # RATE_LIMIT_API_PER_MINUTE: "300"
      # TRUST_PROXY: "true"
      # Telemetry — export traces, metrics and logs to OpenObserve over OTLP.
      # The Authorization value is base64("<ZO_ROOT_USER_EMAIL>:<password>");
      # for the local-dev pair above that is the string below. gRPC carries the
      # organization and the target stream as metadata headers.
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5081
      # OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic YWRtaW5AaGV6YXJmZW4ubG9jYWw6SGV6YXJmZW5fZGV2MSE=,organization=default,stream-name=default"
      # OTEL_SERVICE_NAME: hezarfen-backend
      # OTLP/HTTP instead: the org goes in the path (the SDK appends
      # /v1/{traces,metrics,logs}) and only Authorization is needed.
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      # OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic YWRtaW5AaGV6YXJmZW4ubG9jYWw6SGV6YXJmZW5fZGV2MSE="
      # AI bridge — the AI services dial IN over QUIC. Unset means off; a
      # bad address or a missing token fails the boot rather than leaving a
      # silently dead feature. Listening with no service connected is fine:
      # chat answers 503 until one registers `chat.reply`.
      AI_QUIC_ADDR: 0.0.0.0:8090
      # Every service must present this to register. Local-dev value — change
      # it before this is reachable from anywhere but your machine.
      AI_SHARED_TOKEN: change-me
      # AI_REQUEST_TIMEOUT_SECS: "30"
    volumes:
      - hezarfen-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Telemetry sink ────────────────────────────────────────────────────────
  # OpenObserve is the only telemetry sink (no Grafana/Jaeger/Loki): one Rust
  # binary, its own storage, no container socket and no sidecar databases. It
  # speaks OTLP itself — HTTP on 5080 (also the UI and the search API), gRPC on
  # 5081. Both are published on loopback only.
  openobserve:
    image: docker.io/openobserve/openobserve:v1.0.0-rc2
    container_name: hezarfen-openobserve
    environment:
      # First-boot root account, created once. Local-dev credentials, same
      # status as the root/root above — change them before this is reachable
      # from anywhere but your machine. OpenObserve enforces a password policy
      # (8-128 chars, upper + lower + digit + special) and panics on boot
      # otherwise, hence the shape of this one.
      ZO_ROOT_USER_EMAIL: admin@hezarfen.local
      ZO_ROOT_USER_PASSWORD: Hezarfen_dev1!
      ZO_DATA_DIR: /data
      # Retention is per stream in days; this is the global default applied to
      # streams that don't override it (upstream default is 3650).
      ZO_COMPACT_DATA_RETENTION_DAYS: "90"
    ports:
      - "127.0.0.1:5080:5080"
      - "127.0.0.1:5081:5081"
    volumes:
      - openobserve-data:/data
    restart: unless-stopped
    healthcheck:
      # corner-cut: the image is distroless (only /openobserve, no shell and no
      # HTTP client), so the container cannot probe its own /healthz. `node
      # list` is the closest in-image liveness signal — it succeeds only once
      # the node has registered itself in the cluster registry, which happens
      # after the server starts. Ceiling: it does not prove the HTTP listener
      # answers; from the host that is `curl -fsS http://127.0.0.1:5080/healthz`.
      test: ["CMD", "/openobserve", "node", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  hezarfen-data:
  pgdata:
  openobserve-data:
