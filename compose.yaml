services:
  surrealdb:
    image: docker.io/surrealdb/surrealdb:v3
    container_name: hezarfen-surrealdb
    # Distroless image; its default `nonroot` user can't write a fresh named
    # volume (created root-owned). Run as root — only this service touches
    # surreal-data, the backend never mounts it.
    user: "0"
    command:
      [
        "start",
        "--user", "root",
        "--pass", "root",
        "surrealkv:/data/hezarfen.db",
      ]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - surreal-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/surreal", "isready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/hezarfen-backend:latest
    container_name: hezarfen-backend
    ports:
      - "8080:8080"
      # AI bridge (QUIC = UDP). Paired with AI_QUIC_ADDR below.
      - "8090:8090/udp"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DB_URL: ws://surrealdb:8000
      DB_USER: root
      DB_PASS: root
      DB_NAMESPACE: hezarfen
      DB_DATABASE: hezarfen
      FILES_PATH: /data/files
      RUST_LOG: info,hezarfen_backend=debug
      # First-boot admin seed: created once if the username doesn't exist yet.
      # Local-dev credentials — change or remove before exposing this anywhere.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      # Production knobs — uncomment as needed (see .env.example for docs):
      # COOKIE_SECURE: "true"
      # CORS_ALLOWED_ORIGINS: https://app.example.com
      # RATE_LIMIT_AUTH_PER_MINUTE: "10"
      # RATE_LIMIT_API_PER_MINUTE: "300"
      # TRUST_PROXY: "true"
      # AI bridge — the AI services dial IN over QUIC. Unset means off; a
      # bad address or a missing token fails the boot rather than leaving a
      # silently dead feature. Listening with no service connected is fine:
      # chat answers 503 until one registers `chat.reply`.
      AI_QUIC_ADDR: 0.0.0.0:8090
      # Every service must present this to register. Local-dev value — change
      # it before this is reachable from anywhere but your machine.
      AI_SHARED_TOKEN: change-me
      # AI_REQUEST_TIMEOUT_SECS: "30"
    volumes:
      - hezarfen-data:/data
    depends_on:
      surrealdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hezarfen-data:
  surreal-data:
